services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vaultis
      POSTGRES_USER: vaultis
      POSTGRES_PASSWORD: vaultis
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultis -d vaultis"]
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: ./.env
    environment:
      PYTHONPATH: /app
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app
      - chroma_data:/data/chroma
      - documents_data:/data/documents
volumes:
  postgres_data:
  chroma_data:
  documents_data:
